{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <h2 class="page-title">Login</h2>
    <p class="page-subtitle">Access your UiS course portal account.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="card p-4">
      <label class="form-label">Email</label>
      <input class="form-control mb-3" name="email" type="email" placeholder="name@example.com" required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
      <button class="btn btn-primary w-100">Sign in</button>
      <a class="small mt-3 text-decoration-none" href="/reset-password">Forgot password?</a>
    </form>
  </div>
</div>
{% endblock %}
