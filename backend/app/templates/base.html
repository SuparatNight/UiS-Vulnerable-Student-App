<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAT250 SecureApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/litera/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container py-1">
    <a class="navbar-brand fw-semibold" href="/">
      <i class="bi bi-shield-lock me-2"></i>UiS Student Project Portal
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        {% if user %}
        <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a class="nav-link" href="/profile"><i class="bi bi-person-circle me-1"></i>Profile</a>
        <a class="nav-link" href="/courses"><i class="bi bi-journal-text me-1"></i>Courses</a>
        <a class="nav-link" href="/assignments"><i class="bi bi-cloud-arrow-up me-1"></i>Assignments</a>
        <a class="nav-link" href="/grades"><i class="bi bi-clipboard-data me-1"></i>Grades</a>
        <a class="nav-link" href="/messages"><i class="bi bi-chat-dots me-1"></i>Messages</a>
        <a class="nav-link" href="/admin"><i class="bi bi-sliders me-1"></i>Admin</a>
        <a class="nav-link" href="/resources/import"><i class="bi bi-link-45deg me-1"></i>Resources</a>
        <a class="nav-link" href="/status"><i class="bi bi-activity me-1"></i>Status</a>
        <a class="btn btn-sm btn-light ms-lg-2" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        {% else %}
        <a class="nav-link" href="/login">Login</a>
        <a class="btn btn-sm btn-light ms-lg-2" href="/register">Create account</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<footer class="container py-3 border-top text-muted small">
  DAT250 SecureApp Lab Environment
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.__CURRENT_PATH__ = "{{ request.url.path if request else '/' }}";
</script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
<script>dayjs.extend(dayjs_plugin_relativeTime);</script>
<script src="/static/js/app.js"></script>
</body>
</html>
