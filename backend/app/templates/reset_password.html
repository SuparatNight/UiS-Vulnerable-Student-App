{% extends 'base.html' %}
{% block content %}
<h2 class="page-title">Password reset</h2>
<p class="page-subtitle">Request a reset link or set a new password.</p>
{% if message %}<div class="alert alert-info">{{message}}</div>{% endif %}

{% if mode == 'request' %}
<form method="post" action="/reset-password" class="card p-4">
  <label class="form-label">Email address</label>
  <input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
  <button class="btn btn-primary">Request reset</button>
</form>
{% else %}
<form method="post" action="/reset-password/{{token}}" class="card p-4">
  <label class="form-label">New password</label>
  <input class="form-control mb-3" name="new_password" type="password" placeholder="New password" required>
  <button class="btn btn-success">Set password</button>
</form>
{% endif %}
{% endblock %}
