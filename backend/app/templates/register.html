{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h2 class="page-title">Create account</h2>
    <p class="page-subtitle">Register as a student to access courses and assignments.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="card p-4">
      <label class="form-label">Full name</label>
      <input class="form-control mb-3" name="full_name" placeholder="Full name" required>
      <label class="form-label">Email</label>
      <input class="form-control mb-3" name="email" type="email" placeholder="name@example.com" required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
      <button class="btn btn-success">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
