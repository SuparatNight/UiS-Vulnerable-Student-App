{% extends 'base.html' %}
{% block content %}
<h2 class="page-title">Admin panel</h2>
<p class="page-subtitle">Manage users, submissions, and grading workflows.</p>
<div class="row g-3">
  <div class="col-md-4"><div class="stat-tile"><div class="text-muted small">Users</div><div class="h5 mb-0">{{ users_count }}</div></div></div>
  <div class="col-md-4"><div class="stat-tile"><div class="text-muted small">Submissions</div><div class="h5 mb-0">{{ submissions_count }}</div></div></div>
</div>
<div class="mt-3">
  <a class="btn btn-primary me-2" href="/admin/users"><i class="bi bi-people me-1"></i>Manage users</a>
  <a class="btn btn-outline-primary" href="/admin/grades"><i class="bi bi-award me-1"></i>Manage grades</a>
</div>
{% endblock %}
