services:
  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - backend
    ports:
      - "0.0.0.0:18181:80"
    networks:
      - dat250-net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/var/www/static:ro
      - ./backend/app/uploads:/var/www/uploads

  backend:
    build:
      context: ./backend
    depends_on:
      - db
      - mailhog
    env_file:
      - .env.example
    networks:
      - dat250-net
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: dat250
      POSTGRES_USER: dat250
      POSTGRES_PASSWORD: dat250
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - dat250-net
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports:
      - "0.0.0.0:8025:8025"
    networks:
      - dat250-net

  phppgadmin:
    image: ngosang/phppgadmin@sha256:89c93fc4cce4cc61357a65b244bfdd58b4d82a21fc9a780af4754cf942689ca3
    depends_on:
      - db
    ports:
      - "0.0.0.0:8081:80"
    networks:
      - dat250-net
    volumes:
      - ./phppgadmin/config.inc.php:/var/www/app/conf/config.inc.php:ro

volumes:
  pg_data:

networks:
  dat250-net:
    driver: bridge
